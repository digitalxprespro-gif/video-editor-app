<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Video Editor Pro</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; }
        #timer { font-size: 24px; color: red; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <h2>🎥 ভিডিও এডিটর প্রো</h2>
    <input type="text" id="url" placeholder="ফেসবুক ভিডিও লিংক...">
    <button onclick="startProcessing()">এডিট শুরু করুন</button>
    <div id="status"></div>
    <div id="timer">সময়: ৩০ সেকেন্ড</div>
</div>
<script>
    function startProcessing() {
        let sec = 30;
        document.getElementById('status').innerText = "ভিডিও প্রসেস হচ্ছে...";
        let t = setInterval(() => {
            sec--;
            document.getElementById('timer').innerText = "সময়: " + sec + " সেকেন্ড";
            if(sec <= 0) {
                clearInterval(t);
                document.getElementById('status').innerText = "✅ এডিটিং শেষ! ডাউনলোড করুন।";
            }
        }, 1000);
    }
</script>
</body>
</html>
