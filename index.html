<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Video Editor Pro</title>
    <style>
        #loader { display: none; font-weight: bold; color: blue; }
        .cancel-btn { display: none; color: red; cursor: pointer; }
    </style>
</head>
<body>
    <h1>ভিডিও এডিটর প্রো</h1>
    <input type="text" id="videoUrl" placeholder="ভিডিওর লিংক দিন...">
    <button id="processBtn" onclick="startProcess()">ডাউনলোড ও এডিট</button>
    <span id="cancelBtn" class="cancel-btn" onclick="cancelProcess()">[X] বাতিল করুন</span>
    
    <div id="loader">প্রসেসিং চলছে, দয়া করে অপেক্ষা করুন...</div>

    <script>
        let isProcessing = false;

        function startProcess() {
            isProcessing = true;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('cancelBtn').style.display = 'inline';
            document.getElementById('processBtn').disabled = true;
        }

        function cancelProcess() {
            isProcessing = false;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('processBtn').disabled = false;
            alert("প্রসেসটি বাতিল করা হয়েছে।");
            // সার্ভারে রিকোয়েস্ট ক্যানসেল করার লজিক এখানে যোগ করতে হবে
        }
    </script>
</body>
</html>
