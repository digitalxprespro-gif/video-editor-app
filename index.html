<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Video Editor Pro</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 70%; padding: 10px; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #007bff; color: white; border: none; border-radius: 5px; }
        .cancel-btn { cursor: pointer; color: red; font-size: 20px; }
        #status, #timer { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎥 ভিডিও এডিটর প্রো</h2>
    <div>
        <input type="text" id="url" placeholder="লিংক দিন...">
        <span class="cancel-btn" onclick="document.getElementById('url').value=''">×</span>
    </div>
    <button onclick="start()">ডাউনলোড ও এডিট</button>
    <div id="status"></div>
    <div id="timer">সময়: ২০ সেকেন্ড</div>
</div>
<script>
    async function start() {
        let s = 20;
        let t = setInterval(() => { s--; document.getElementById('timer').innerText = "সময়: "+s+" সেকেন্ড"; if(s<=0) clearInterval(t); }, 1000);
        document.getElementById('status').innerText = "এডিটিং চলছে...";
        const res = await fetch('/process', { method: 'POST', body: JSON.stringify({url: document.getElementById('url').value}), headers: {'Content-Type': 'application/json'}});
        const data = await res.json();
        document.getElementById('status').innerText = data.message;
    }
</script>
</body>
</html>
