<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Video Editor Pro</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; }
        .btn { background: #007bff; color: white; cursor: pointer; border: none; }
        .lofi-btn { background: #6f42c1; color: white; border: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎥 ভিডিও এডিটর প্রো</h2>
    <input type="text" id="url" placeholder="ফেসবুক ভিডিও লিংক...">
    <button class="btn" onclick="alert('প্রসেসিং শুরু হচ্ছে...')">ডাউনলোড ও এডিট</button>
    <button class="lofi-btn" onclick="alert('লফি মোড চালু...')">লফি (Lofi) মোড চালু</button>
    <hr>
    <p>আপনার ফাইল:</p>
    <input type="file">
    <button class="btn" style="background:#28a745">আপলোড করে এডিট</button>
</div>
</body>
</html>
