<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Video Editor Pro</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        #status, #timer { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎥 ভিডিও এডিটর প্রো</h2>
        <input type="text" id="videoUrl" placeholder="ভিডিও লিংক দিন...">
        <button id="processBtn" onclick="sendToBackend()">এডিট শুরু করুন</button>
        <div id="status"></div>
        <div id="timer">সময়: ০ সেকেন্ড</div>
    </div>

    <script>
        async function sendToBackend() {
            const url = document.getElementById('videoUrl').value;
            const statusDiv = document.getElementById('status');
            const timerDiv = document.getElementById('timer');
            
            if(!url) return alert("লিংক দিন!");
            
            // টাইমার ও ইউআই আপডেট
            document.getElementById('processBtn').disabled = true;
            let s = 0;
            let timer = setInterval(() => { s++; timerDiv.innerText = "সময়: " + s + " সেকেন্ড"; }, 1000);
            statusDiv.innerText = "সার্ভারে পাঠানো হচ্ছে...";

            // ব্যাকএন্ডে রিকোয়েস্ট পাঠানো
            const response = await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            });

            const data = await response.json();
            statusDiv.innerText = "✅ " + data.message;
            clearInterval(timer);
            document.getElementById('processBtn').disabled = false;
        }
    </script>
</body>
</html>
