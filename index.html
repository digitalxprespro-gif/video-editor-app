<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Video Editor Pro</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; }
        .btn { background: #007bff; color: white; cursor: pointer; border: none; }
        #timer { font-size: 20px; color: red; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎥 ভিডিও এডিটর প্রো</h2>
    <input type="text" id="url" placeholder="ফেসবুক ভিডিও লিংক...">
    <button class="btn" onclick="startProcessing()">ডাউনলোড ও এডিট</button>
    <div id="timer"></div>
    <a id="downloadLink" href="/download_video" style="display:none;">
        <button style="background:green; color:white; margin-top:10px;">ফাইলটি ডাউনলোড করুন</button>
    </a>
</div>
<script>
    function startProcessing() {
        let sec = 30;
        document.getElementById('timer').innerText = "সময়: " + sec + " সেকেন্ড";
        let t = setInterval(() => {
            sec--;
            document.getElementById('timer').innerText = "সময়: " + sec + " সেকেন্ড";
            if(sec <= 0) {
                clearInterval(t);
                document.getElementById('timer').innerText = "✅ এডিটিং শেষ!";
                document.getElementById('downloadLink').style.display = "block";
            }
        }, 1000);
    }
</script>
</body>
</html>
